[package]
name = "okfx_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
okfx_cache = { path = "../okfx_cache" }
okfx_fmt = { path = "../okfx_fmt" }
okfx_graph = { path = "../okfx_graph" }
okfx_index = { path = "../okfx_index" }
okfx_pack = { path = "../okfx_pack" }
okfx_parser = { path = "../okfx_parser" }
okfx_resolver = { path = "../okfx_resolver" }
okfx_rules = { path = "../okfx_rules" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
