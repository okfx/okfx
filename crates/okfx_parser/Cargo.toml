[package]
name = "okfx_parser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
saphyr = { version = "0.0.11", default-features = false }
saphyr-parser = "0.0.11"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1.0"
