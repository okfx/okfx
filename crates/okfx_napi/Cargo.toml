[package]
name = "okfx_napi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = "2"
okfx_cache = { path = "../okfx_cache" }
okfx_fmt = { path = "../okfx_fmt" }
okfx_fs = { path = "../okfx_fs" }
okfx_graph = { path = "../okfx_graph" }
okfx_index = { path = "../okfx_index" }
okfx_pack = { path = "../okfx_pack" }
okfx_parser = { path = "../okfx_parser" }
okfx_resolver = { path = "../okfx_resolver" }
okfx_rules = { path = "../okfx_rules" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
