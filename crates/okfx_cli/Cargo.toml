[package]
name = "okfx_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "okfx"
path = "src/main.rs"

[dependencies]
okfx_fmt = { path = "../okfx_fmt" }
okfx_parser = { path = "../okfx_parser" }
okfx_rules = { path = "../okfx_rules" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
