name: OKF
description: Validate, lint, graph, and doctor an Open Knowledge Format bundle.
inputs:
  cli-version:
    description: Exact okfx version to install.
    required: false
    default: "0.1.2"
  bundle:
    description: OKF bundle root.
    required: false
    default: .
  lint-format:
    description: Lint output format.
    required: false
    default: pretty
  graph-out:
    description: Graph JSON output path.
    required: false
    default: okf-graph.json
  lint-json-out:
    description: Lint JSON output path used for summaries and PR comments.
    required: false
    default: okf-lint.json
  doctor-json-out:
    description: Doctor JSON output path used for summaries and PR comments.
    required: false
    default: okf-doctor.json
  doctor:
    description: Run okf doctor.
    required: false
    default: "true"
  summary:
    description: Write an OKF summary to the GitHub Step Summary.
    required: false
    default: "true"
  pr-comment:
    description: Comment the OKF summary on pull requests.
    required: false
    default: "false"
  github-token:
    description: GitHub token for pull request comments.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Setup okfx
      shell: bash
      env:
        OKFX_CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        corepack enable
        corepack prepare pnpm@11.8.0 --activate
        install_dir="${RUNNER_TEMP:-/tmp}/okfx-action-cli"
        rm -rf "$install_dir"
        mkdir -p "$install_dir"
        cd "$install_dir"
        node <<'NODE'
        const fs = require("node:fs");
        const version = process.env.OKFX_CLI_VERSION;
        if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
          throw new Error("cli-version must be an exact semantic version");
        }
        fs.writeFileSync("package.json", `${JSON.stringify({
          private: true,
          dependencies: { "okfx": version }
        })}\n`);
        NODE
        pnpm install --prod --ignore-scripts
        echo "$install_dir/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Validate OKF
      id: validate
      shell: bash
      env:
        OKF_BUNDLE: ${{ inputs.bundle }}
      run: |
        set +e
        okf validate -- "$OKF_BUNDLE"
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Lint OKF
      id: lint
      shell: bash
      env:
        OKF_BUNDLE: ${{ inputs.bundle }}
        OKF_LINT_FORMAT: ${{ inputs.lint-format }}
        OKF_LINT_JSON: ${{ inputs.lint-json-out }}
      run: |
        set +e
        okf lint --format "$OKF_LINT_FORMAT" -- "$OKF_BUNDLE"
        status=$?
        if [ -f "$OKF_LINT_JSON" ] && [ ! -L "$OKF_LINT_JSON" ]; then
          rm -f -- "$OKF_LINT_JSON"
        fi
        okf lint --format json --out "$OKF_LINT_JSON" -- "$OKF_BUNDLE" >/dev/null 2>&1 || true
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Build graph
      id: graph
      shell: bash
      env:
        OKF_BUNDLE: ${{ inputs.bundle }}
        OKF_GRAPH_JSON: ${{ inputs.graph-out }}
      run: |
        set +e
        if [ -f "$OKF_GRAPH_JSON" ] && [ ! -L "$OKF_GRAPH_JSON" ]; then
          rm -f -- "$OKF_GRAPH_JSON"
        fi
        okf graph --out "$OKF_GRAPH_JSON" -- "$OKF_BUNDLE"
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Doctor
      id: doctor
      if: ${{ inputs.doctor == 'true' }}
      shell: bash
      env:
        OKF_BUNDLE: ${{ inputs.bundle }}
        OKF_DOCTOR_JSON: ${{ inputs.doctor-json-out }}
      run: |
        set +e
        if [ -f "$OKF_DOCTOR_JSON" ] && [ ! -L "$OKF_DOCTOR_JSON" ]; then
          rm -f -- "$OKF_DOCTOR_JSON"
        fi
        okf doctor --json --out "$OKF_DOCTOR_JSON" -- "$OKF_BUNDLE"
        status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Write OKF summary
      if: ${{ inputs.summary == 'true' }}
      shell: bash
      env:
        OKF_BUNDLE: ${{ inputs.bundle }}
        OKF_RUN_DOCTOR: ${{ inputs.doctor }}
        OKF_LINT_JSON: ${{ inputs.lint-json-out }}
        OKF_DOCTOR_JSON: ${{ inputs.doctor-json-out }}
        OKF_GRAPH_JSON: ${{ inputs.graph-out }}
      run: |
        node <<'NODE'
        const fs = require("node:fs");
        const readJson = (path) => {
          try {
            const entry = fs.lstatSync(path);
            return entry.isFile() && !entry.isSymbolicLink()
              ? JSON.parse(fs.readFileSync(path, "utf8"))
              : undefined;
          } catch {
            return undefined;
          }
        };
        const markdownCode = (value) => {
          const visibleValue = String(value).replace(/\r/g, "\\r").replace(/\n/g, "\\n");
          let longestFence = 0;
          for (const match of visibleValue.matchAll(/`+/g)) {
            longestFence = Math.max(longestFence, match[0].length);
          }
          const fence = "`".repeat(longestFence + 1);
          const padding = /^[ `]|[ `]$/.test(visibleValue) ? " " : "";
          return `${fence}${padding}${visibleValue}${padding}${fence}`;
        };
        const doctor = process.env.OKF_RUN_DOCTOR === "true" ? readJson(process.env.OKF_DOCTOR_JSON) : undefined;
        const lint = readJson(process.env.OKF_LINT_JSON);
        const graph = readJson(process.env.OKF_GRAPH_JSON);
        const source = doctor ?? lint ?? {};
        const summary = { ...(lint?.stats ?? {}), ...(graph?.stats ?? {}), ...(source.summary ?? {}) };
        const counts = source.counts ?? {};
        const lines = [
          "## OKF Summary",
          "",
          `Bundle: ${markdownCode(process.env.OKF_BUNDLE)}`,
          source.score === undefined ? undefined : `Agent readiness: **${source.score}/100**`,
          "",
          "### Concepts",
          `- Concepts: ${summary.conceptCount ?? 0}`,
          `- Links: ${summary.linkCount ?? 0}`,
          `- Broken links: ${summary.brokenLinkCount ?? 0}`,
          `- Orphan concepts: ${summary.orphanCount ?? 0}`,
          `- Cycles: ${summary.cycleCount ?? 0}`,
          "",
          "### Diagnostics",
          `- Errors: ${counts.error ?? 0}`,
          `- Warnings: ${counts.warning ?? 0}`,
          `- Advice: ${counts.advice ?? 0}`,
          `- Info: ${counts.info ?? 0}`,
          "",
          "### Artifacts",
          lint ? `- Lint JSON: ${markdownCode(process.env.OKF_LINT_JSON)}` : undefined,
          graph ? `- Graph JSON: ${markdownCode(process.env.OKF_GRAPH_JSON)}` : undefined,
          doctor ? `- Doctor JSON: ${markdownCode(process.env.OKF_DOCTOR_JSON)}` : undefined
        ].filter(Boolean).join("\n") + "\n";
        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines);
        NODE
    - name: Comment OKF summary
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        OKF_BUNDLE: ${{ inputs.bundle }}
        OKF_RUN_DOCTOR: ${{ inputs.doctor }}
        OKF_LINT_JSON: ${{ inputs.lint-json-out }}
        OKF_DOCTOR_JSON: ${{ inputs.doctor-json-out }}
        OKF_GRAPH_JSON: ${{ inputs.graph-out }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("node:fs");
          const readJson = (path) => {
            try {
              const entry = fs.lstatSync(path);
              return entry.isFile() && !entry.isSymbolicLink()
                ? JSON.parse(fs.readFileSync(path, "utf8"))
                : undefined;
            } catch {
              return undefined;
            }
          };
          const markdownCode = (value) => {
            const visibleValue = String(value).replace(/\r/g, "\\r").replace(/\n/g, "\\n");
            let longestFence = 0;
            for (const match of visibleValue.matchAll(/`+/g)) {
              longestFence = Math.max(longestFence, match[0].length);
            }
            const fence = "`".repeat(longestFence + 1);
            const padding = /^[ `]|[ `]$/.test(visibleValue) ? " " : "";
            return `${fence}${padding}${visibleValue}${padding}${fence}`;
          };
          const doctor = process.env.OKF_RUN_DOCTOR === "true" ? readJson(process.env.OKF_DOCTOR_JSON) : undefined;
          const lint = readJson(process.env.OKF_LINT_JSON);
          const graph = readJson(process.env.OKF_GRAPH_JSON);
          const source = doctor ?? lint ?? {};
          const summary = { ...(lint?.stats ?? {}), ...(graph?.stats ?? {}), ...(source.summary ?? {}) };
          const counts = source.counts ?? {};
          const marker = "<!-- okfx-summary -->";
          const body = [
            marker,
            "## OKF Summary",
            "",
            `Bundle: ${markdownCode(process.env.OKF_BUNDLE)}`,
            source.score === undefined ? undefined : `Agent readiness: **${source.score}/100**`,
            "",
            "### Concepts",
            `- Concepts: ${summary.conceptCount ?? 0}`,
            `- Links: ${summary.linkCount ?? 0}`,
            `- Broken links: ${summary.brokenLinkCount ?? 0}`,
            `- Orphan concepts: ${summary.orphanCount ?? 0}`,
            `- Cycles: ${summary.cycleCount ?? 0}`,
            "",
            "### Diagnostics",
            `- Errors: ${counts.error ?? 0}`,
            `- Warnings: ${counts.warning ?? 0}`,
            `- Advice: ${counts.advice ?? 0}`,
            `- Info: ${counts.info ?? 0}`,
            "",
            "### Artifacts",
            lint ? `- Lint JSON: ${markdownCode(process.env.OKF_LINT_JSON)}` : undefined,
            graph ? `- Graph JSON: ${markdownCode(process.env.OKF_GRAPH_JSON)}` : undefined,
            doctor ? `- Doctor JSON: ${markdownCode(process.env.OKF_DOCTOR_JSON)}` : undefined
          ].filter(Boolean).join("\n");
          const issue = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number
          };
          const comments = await github.paginate(github.rest.issues.listComments, {
            ...issue,
            per_page: 100
          });
          const previous = comments.find((comment) =>
            comment.user?.type === "Bot" && comment.body?.includes(marker)
          );
          if (previous) {
            await github.rest.issues.updateComment({
              owner: issue.owner,
              repo: issue.repo,
              comment_id: previous.id,
              body
            });
          } else {
            await github.rest.issues.createComment({ ...issue, body });
          }
    - name: OKF quality gate
      shell: bash
      env:
        OKF_RUN_DOCTOR: ${{ inputs.doctor }}
        OKF_VALIDATE_STATUS: ${{ steps.validate.outputs.status }}
        OKF_LINT_STATUS: ${{ steps.lint.outputs.status }}
        OKF_GRAPH_STATUS: ${{ steps.graph.outputs.status }}
        OKF_DOCTOR_STATUS: ${{ steps.doctor.outputs.status }}
      run: |
        status=0
        if [ "$OKF_VALIDATE_STATUS" != "0" ]; then status="$OKF_VALIDATE_STATUS"; fi
        if [ "$OKF_LINT_STATUS" != "0" ]; then status="$OKF_LINT_STATUS"; fi
        if [ "$OKF_GRAPH_STATUS" != "0" ]; then status="$OKF_GRAPH_STATUS"; fi
        if [ "$OKF_RUN_DOCTOR" = "true" ] && [ "$OKF_DOCTOR_STATUS" != "0" ]; then status="$OKF_DOCTOR_STATUS"; fi
        exit "$status"
