name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source and packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: pnpm check:release-version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test TypeScript packages
        run: pnpm test

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level moderate

      - name: Verify repository OKF content
        run: pnpm check:okf

      - name: Check Rust formatting and lints
        run: pnpm check:rust

      - name: Test Rust workspace
        run: cargo test --workspace

      - name: Build WASM fallback
        run: cargo build -p okfx_wasm --target wasm32-unknown-unknown

      - name: Dry-run all workspace packages
        run: pnpm --filter './packages/*' pack --dry-run

  publish-npm:
    name: Publish npm packages
    needs: verify
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm build

      - name: Publish npm packages in dependency order
        run: |
          set -euo pipefail
          pnpm --filter '@okfxjs/core' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/github-action' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/plugin-api' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/mcp' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/preset-agent-ready' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/preset-recommended' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/preset-strict' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/vscode' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/adapter-bigquery' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/adapter-datahub' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/adapter-dbt' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/adapter-markdown' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/adapter-openapi' publish --access public --tag latest --no-git-checks
          pnpm --filter '@okfxjs/adapter-static-site' publish --access public --tag latest --no-git-checks
          pnpm --filter 'okfx' publish --access public --tag latest --no-git-checks

  binaries:
    name: Build standalone binary ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64-gnu
            exe: ""
            archive: tar.gz
          - os: macos-14
            target: darwin-arm64
            exe: ""
            archive: tar.gz
          - os: windows-latest
            target: win32-x64-msvc
            exe: ".exe"
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI binary
        run: cargo build -p okfx_cli --release

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          asset="okfx-${{ matrix.target }}.${{ matrix.archive }}"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            7z a "dist/${asset}" "target/release/okfx${{ matrix.exe }}"
          else
            tar -czf "dist/${asset}" -C target/release "okfx${{ matrix.exe }}"
          fi

      - name: Stage binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: okfx-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs:
      - verify
      - binaries
      - publish-npm
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "okfx ${GITHUB_REF_NAME}"

  upload-assets:
    name: Upload release assets
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download staged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: okfx-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
